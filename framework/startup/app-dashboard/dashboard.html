<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application dashboard</title>
  <style>
    :root { --nci-blue: #0f6a9c; --ink: #1a1a1a; --muted: #5c6670; --line: #dfe3e8; --ok: #1d7a46; --warn: #a65f00; --bad: #b3261e; --bg: #f5f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.45; }
    .nci-header { display: flex; align-items: center; gap: 1.25rem; background: #fff; border-bottom: 1px solid var(--line); padding: .75rem 1.5rem; }
    .nci-header img { display: block; height: 48px; width: auto; }
    .nci-header__title { font-size: 1.1rem; font-weight: 700; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    section { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.1rem; }
    section.wide { grid-column: 1 / -1; }
    h2 { font-size: 1rem; margin: 0 0 .6rem; color: var(--nci-blue); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; padding: .05rem .55rem; border-radius: 999px; font-size: .8rem; font-weight: 700; color: #fff; background: var(--muted); }
    .pill.ok, .pill.passed { background: var(--ok); }
    .pill.degraded, .pill.skipped { background: var(--warn); }
    .pill.bad, .pill.failed, .pill.error { background: var(--bad); }
    .unavailable { color: var(--muted); font-style: italic; }
    .scroll { max-height: 320px; overflow: auto; }
    a { color: var(--nci-blue); }
    footer { background: var(--nci-blue); color: #fff; text-align: center; padding: 1rem; font-size: .9rem; }
    footer a { color: #fff; }
    #error { background: #fdecea; color: var(--bad); padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="nci-header">
    <a href="https://www.cancer.gov" aria-label="National Cancer Institute home page"><img src="https://www.cancer.gov/profiles/custom/cgov_site/themes/custom/cgov/static/images/design-elements/logos/nci-logo-full.svg" alt="National Cancer Institute"></a>
    <span class="nci-header__title" id="header-title">Application dashboard</span>
  </header>
  <main>
    <h1 id="title">Application dashboard</h1>
    <p class="sub" id="subtitle">Loading&hellip;</p>
    <div id="error" hidden role="alert"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer>Generated by the NCI app-dashboard skill &middot; JSON: <a id="json-link" href="api/dashboard">api/dashboard</a></footer>

  <script>
    // All values are inserted with textContent; never innerHTML. Relative URLs keep this working under API Gateway stage prefixes such as /dev/.
    const grid = document.getElementById("grid");

    function el(tag, opts = {}, ...children) {
      const node = document.createElement(tag);
      if (opts.cls) node.className = opts.cls;
      if (opts.text !== undefined) node.textContent = String(opts.text);
      for (const child of children) node.append(child);
      return node;
    }
    function safeHref(value) {
      try { const u = new URL(value); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : null; } catch { return null; }
    }
    function link(text, href) {
      const safe = safeHref(href);
      if (!safe) return el("span", { text });
      const a = el("a", { text }); a.href = safe; a.rel = "noopener noreferrer"; return a;
    }
    function pill(text, tone) { return el("span", { cls: "pill " + (tone || ""), text }); }
    function value(v) { return (v === null || v === undefined || v === "") ? "—" : v; }
    function card(title, wide) { const s = el("section", { cls: wide ? "wide" : "" }, el("h2", { text: title })); grid.append(s); return s; }
    function unavailable(section, block) { section.append(el("p", { cls: "unavailable", text: "Not available: " + (block && block.reason ? block.reason : "no data") })); }
    function facts(section, rows) {
      const dl = el("dl");
      for (const [k, v] of rows) { dl.append(el("dt", { text: k })); const dd = el("dd"); dd.append(v instanceof Node ? v : document.createTextNode(String(value(v)))); dl.append(dd); }
      section.append(dl);
    }
    function table(section, headers, rows) {
      const t = el("table"); const head = el("tr");
      for (const h of headers) head.append(el("th", { text: h }));
      t.append(el("thead", {}, head));
      const body = el("tbody");
      for (const row of rows) { const tr = el("tr"); for (const cell of row) tr.append(el("td", {}, cell instanceof Node ? cell : document.createTextNode(String(value(cell))))); body.append(tr); }
      t.append(body); section.append(el("div", { cls: "scroll" }, t));
    }
    function fmtUptime(s) { s = Math.floor(s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + "d " : "") + (h || d ? h + "h " : "") + m + "m " + (s % 60) + "s"; }

    function render(d) {
      const app = d.app || {};
      document.title = (app.name || "Application") + " dashboard";
      document.getElementById("title").textContent = (app.name || "Application") + " dashboard";
      document.getElementById("header-title").textContent = app.name || "Application dashboard";
      document.getElementById("subtitle").textContent = (app.description || "") + (d.generatedAt ? "  ·  Updated " + d.generatedAt : "");

      const h = d.health || {};
      const s1 = card("Health");
      s1.append(pill(h.status || "unknown", h.status === "ok" ? "ok" : h.status === "degraded" ? "degraded" : "bad"));
      if (Array.isArray(h.checks) && h.checks.length) table(s1, ["Check", "Status", "Detail"], h.checks.map(c => [c.name, pill(c.status, c.status === "ok" ? "ok" : "bad"), c.detail]));

      const rt = d.runtime || {};
      facts(card("Runtime"), [["Started", rt.startedAt], ["Uptime", rt.uptimeSeconds !== undefined ? fmtUptime(rt.uptimeSeconds) : null], ["Language", rt.language], ["Framework", rt.framework]]);

      const u = d.usage || {};
      const s3 = card("Usage");
      facts(s3, [["Scope", u.scope], ["Since", u.since], ["Requests", u.totalRequests], ["Errors (5xx)", u.errorRequests], ["Last request", u.lastRequestAt]]);
      const routes = Object.entries(u.byRoute || {}).sort((a, b) => b[1] - a[1]);
      if (routes.length) table(s3, ["Route", "Requests"], routes);

      const dep = d.deployment || {};
      if (dep.status === "unavailable") unavailable(card("Deployment"), dep);
      else facts(card("Deployment"), [["Environment", dep.environment], ["Version", app.version], ["Stack", dep.stackName], ["Region", dep.region], ["Commit", dep.commit ? dep.commit.slice(0, 12) : null], ["Built", dep.builtAt], ["Workflow run", dep.workflowRunUrl ? link("open run", dep.workflowRunUrl) : null]]);

      const t = d.tests || {};
      const s5 = card("Test cases", true);
      if (t.status === "unavailable") unavailable(s5, t);
      else {
        const sum = t.summary || {};
        facts(s5, [["Total", sum.total], ["Passed", sum.passed], ["Failed", sum.failed], ["Skipped", sum.skipped], ["Run at", t.ranAt]]);
        if (Array.isArray(t.cases) && t.cases.length) table(s5, ["Suite", "Test", "Result"], t.cases.map(c => [c.suite, c.name, pill(c.status, c.status)]));
      }

      const docs = d.documentation || {};
      const s6 = card("Documentation");
      if (docs.status === "unavailable") unavailable(s6, docs);
      else table(s6, ["Document", "Path"], (docs.items || []).map(i => [link(i.title || i.path, i.url), i.path]));

      const iss = d.issues || {};
      const s7 = card("Outstanding issues");
      if (iss.status === "unavailable") unavailable(s7, iss);
      else {
        facts(s7, [["Open", iss.open], ["Fetched", iss.fetchedAt]]);
        if (iss.titlesIncluded === false) s7.append(el("p", { cls: "unavailable", text: "Titles are hidden because the repository is private. See the repository's Issues tab." }));
        else if (Array.isArray(iss.items) && iss.items.length) table(s7, ["#", "Title", "Labels"], iss.items.map(i => [link("#" + i.number, i.url), i.title, (i.labels || []).join(", ")]));
      }

      const reg = card("Registry", true);
      facts(reg, [["Registry id", app.id], ["Owner", app.owner], ["Type", app.appType], ["Repository", app.repository ? link(app.repository, app.repository) : null], ["Skills used", (app.skillsUsed || []).join(", ")]]);
    }

    fetch("api/dashboard", { cache: "no-store", headers: { Accept: "application/json" } })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(err => { const box = document.getElementById("error"); box.textContent = "Could not load dashboard data. " + err.message; box.hidden = false; document.getElementById("subtitle").textContent = ""; });
  </script>
</body>
</html>
